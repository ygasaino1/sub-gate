<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sub-gate link builder</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  label { display: block; margin: 1rem 0 .25rem; font-weight: 600; }
  input, select, textarea { width: 100%; box-sizing: border-box; padding: .5rem; font: inherit; }
  textarea { min-height: 5rem; }
  output { display: block; margin-top: 1.25rem; padding: .75rem; background: #8881; border-radius: 6px; word-break: break-all; font-family: ui-monospace, monospace; }
  small { color: #888; }
  button { margin-top: .75rem; padding: .5rem 1rem; font: inherit; }
</style>
</head>
<body>
<h1>sub-gate link builder</h1>
<p><small>Runs entirely in your browser. Nothing is sent anywhere. Save this file locally if you prefer.</small></p>

<label for="base">Your Worker address</label>
<input id="base" placeholder="https://gate.yourdomain.com">

<label for="token">GATE_TOKEN</label>
<input id="token" placeholder="the secret you set on the Worker">

<label for="subs">Real subscription link(s), one per line</label>
<textarea id="subs" placeholder="https://provider.com/sub?token=abc"></textarea>

<label for="fp">Fingerprint</label>
<select id="fp">
  <option value="">default (unsafe)</option>
  <option>chrome</option><option>firefox</option><option>safari</option><option>random</option><option>none</option>
</select>

<label><input id="plain" type="checkbox" style="width:auto"> Plain text output instead of base64</label>

<output id="out">Fill in the fields above.</output>
<button id="copy" type="button">Copy link</button>

<script>
  const $ = (id) => document.getElementById(id);
  function build() {
    const base = $('base').value.trim().replace(/\/+$/, '');
    const token = $('token').value.trim();
    const subs = $('subs').value.split(/\n+/).map((s) => s.trim()).filter(Boolean);
    if (!base || !token || !subs.length) { $('out').textContent = 'Fill in the fields above.'; return ''; }
    const parts = subs.map((s) => 'u=' + encodeURIComponent(s));
    if ($('fp').value) parts.push('fp=' + $('fp').value);
    if ($('plain').checked) parts.push('plain=1');
    const link = base + '/sub/' + encodeURIComponent(token) + '?' + parts.join('&');
    $('out').textContent = link;
    return link;
  }
  ['base', 'token', 'subs', 'fp', 'plain'].forEach((id) => $(id).addEventListener('input', build));
  $('copy').addEventListener('click', () => { const l = build(); if (l) navigator.clipboard.writeText(l); });
</script>
</body>
</html>
